[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexcloak-pdf-tool"
# Version is sourced from ``lexcloak_pdf_tool.__version__`` (single source of
# truth) via the ``[tool.setuptools.dynamic]`` block below, so the packaged
# version and the CLI ``--version`` flag can never drift (Session 342).
dynamic = ["version"]
description = "AGPL-licensed PyMuPDF I/O wrapper used by Lex Cloak desktop. Communicates with the closed Lex Cloak app via length-prefixed JSON over stdin/stdout."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Monty Home LLC", email = "support@lexcloak.com" },
]
keywords = ["pdf", "pymupdf", "agpl", "redaction", "lexcloak"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pymupdf>=1.27.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/montyhome/lexcloak-pdf-tool"
Issues = "https://github.com/montyhome/lexcloak-pdf-tool/issues"

[project.scripts]
lexcloak-pdf-tool = "lexcloak_pdf_tool.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "lexcloak_pdf_tool.__version__" }

[tool.setuptools.packages.find]
include = ["lexcloak_pdf_tool*"]
exclude = ["tests*"]
